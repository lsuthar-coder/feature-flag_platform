name: Deploy Feature Flag API

on:
  push:
    branches:
      - main
    paths:
      - 'backend/feature-flag-api/**'
      - '.github/workflows/deploy-feature-flag-api.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/feature-flag-api
  NAMESPACE: feature-flag
  DEPLOYMENT: feature-flag-api
  CONTAINER: feature-flag-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/feature-flag-api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        run: |
          kubectl -n ${{ env.NAMESPACE }} \
            set image deployment/${{ env.DEPLOYMENT }} \
            ${{ env.CONTAINER }}=${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl -n ${{ env.NAMESPACE }} \
            rollout status deployment/${{ env.DEPLOYMENT }} \
            --timeout=180s

      - name: Deployment status
        run: |
          kubectl -n ${{ env.NAMESPACE }} \
            get deployment ${{ env.DEPLOYMENT }}

          kubectl -n ${{ env.NAMESPACE }} \
            get pods -l app=${{ env.DEPLOYMENT }}