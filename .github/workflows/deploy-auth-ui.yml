name: Deploy Auth UI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/auth-ui/**"
      - "k8s/auth-ui/**"
      - ".github/workflows/deploy-auth-ui.yml"

env:
  IMAGE_NAME: ghcr.io/lsuthar-coder/auth-ui
  NAMESPACE: feature-flag
  DEPLOYMENT: auth-ui
  CONTAINER: auth-ui

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/auth-ui
          file: ./frontend/auth-ui/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        run: |
          kubectl -n ${{ env.NAMESPACE }} \
            set image deployment/${{ env.DEPLOYMENT }} \
            ${{ env.CONTAINER }}=${{ env.IMAGE_NAME }}:${{ github.sha }}

          kubectl -n ${{ env.NAMESPACE }} \
            rollout status deployment/${{ env.DEPLOYMENT }} \
            --timeout=180s