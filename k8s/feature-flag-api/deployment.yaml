apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flag-api
  namespace: feature-flag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feature-flag-api
  template:
    metadata:
      labels:
        app: feature-flag-api
    spec:
      containers:
        - name: feature-flag-api
          image: ghcr.io/lsuthar-coder/feature-flag-api:latest

          ports:
            - name: http
              containerPort: 4000

          envFrom:
            - secretRef:
                name: feature-flag-api-common
            - secretRef:
                name: feature-flag-api-db
            - secretRef:
                name: feature-flag-api-pem

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10