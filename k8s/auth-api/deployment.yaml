apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: feature-flag
  labels:
    app: auth-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-api

  template:
    metadata:
      labels:
        app: auth-api

    spec:
      containers:
        - name: auth-api
          image: ghcr.io/lsuthar-coder/auth-api:latest

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5001
              protocol: TCP

          envFrom:
            - secretRef:
                name: auth-api-secrets

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          terminationMessagePolicy: File

      terminationGracePeriodSeconds: 30