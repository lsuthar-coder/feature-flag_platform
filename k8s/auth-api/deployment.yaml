apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: feature-flag
  labels:
    app: auth-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-api

  template:
    metadata:
      labels:
        app: auth-api

    spec:
      containers:
        - name: auth-api
          image: ghcr.io/lsuthar-coder/auth-api:latest

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            # PostgreSQL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-api-db
                  key: postgres_url

            # Redis
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: auth-api-db
                  key: redis_url

            # RSA private key
            - name: PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: auth-api-pem
                  key: private_key_pem

            # RSA public key
            - name: PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: auth-api-pem
                  key: public_key_pem

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      terminationGracePeriodSeconds: 30